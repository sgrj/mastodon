# Throwaway services for the test suite only.
#
# WARNING: never point the test suite at your development Redis. spec/rails_helper.rb
# runs `redis.del(redis.keys)` after every single example, and Redis pub/sub is not
# database-scoped, so a shared server leaks events in both directions. The test Redis
# deliberately listens on 6380 to stay clear of the default 6379.
#
# Managed automatically by bin/rspec-local; you should not need to run this by hand.
version: '3'

services:
  test-db:
    image: postgres:14-alpine # matches .github/workflows/test-ruby.yml
    environment:
      - 'POSTGRES_HOST_AUTH_METHOD=trust'
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - mastodon-test-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 2s
      timeout: 5s
      retries: 15

  test-redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  mastodon-test-db:
